<!doctype html>
<html lang="uz">
<head>

<style>
:root{--fon:#0B2E22;--fon2:#123D2E;--k:#fff;--m:#111827;--s:#6B7280;--ch:#E5E7EB;--y:#166534;--yo:#DCFCE7;--q:#B91C1C;--qo:#FEE2E2;--sa:#92400E;--sao:#FEF3C7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--m);font-size:15px;
  background-color:var(--fon);background-image:radial-gradient(circle at 20% 0%,#1E5A43 0,transparent 45%),radial-gradient(circle at 100% 60%,#14523B 0,transparent 40%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,#fff 0 1px,transparent 1px 14px)}
header{position:sticky;top:0;z-index:5;padding:14px 16px 12px;color:#fff;display:flex;align-items:center;gap:10px;background:rgba(11,46,34,.92);backdrop-filter:blur(6px)}
header b{font-size:20px;letter-spacing:.5px}header small{display:block;opacity:.75;font-size:12px}
header .bosh{flex:1}header button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:15px}
main{position:relative;padding:12px 12px 96px;max-width:640px;margin:0 auto}
h3{color:#BBF7D0;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;margin:18px 4px 8px}
.karta{background:var(--k);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{background:var(--yo);border-radius:14px;padding:12px}.kpi small{color:var(--y);font-weight:600;font-size:12px}.kpi b{display:block;font-size:22px;margin:4px 0}
.qator{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ch)}.qator:last-child{border:0}
.qator span:last-child{font-weight:700;text-align:right}
.up{color:var(--y);font-size:12px;font-weight:700}.down{color:var(--q);font-size:12px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.tabs button{white-space:nowrap;border:0;border-radius:20px;padding:8px 14px;background:rgba(255,255,255,.14);color:#fff;font-size:14px}
.tabs button.on{background:#fff;color:var(--y);font-weight:700}
.bar{display:flex;align-items:flex-end;gap:3px;height:110px}.bar i{flex:1;background:var(--y);border-radius:3px 3px 0 0;min-height:2px}
.bar.t i{background:#115E59}.lbl{display:flex;justify-content:space-between;color:var(--s);font-size:11px;margin-top:4px}
.kichik{color:var(--s);font-size:12.5px}.oq{color:#D1FAE5;font-size:12.5px;margin:4px}
.belgi{display:inline-block;border-radius:8px;padding:2px 7px;font-size:11.5px;font-weight:700}
.b-OK{background:var(--yo);color:var(--y)}.b-DIQQAT{background:var(--sao);color:var(--sa)}.b-XATO{background:var(--qo);color:var(--q)}
button.a{border:0;border-radius:12px;padding:10px 14px;background:var(--y);color:#fff;font-weight:700;font-size:14px}
button.o{border:1px solid var(--ch);border-radius:12px;padding:9px 12px;background:#fff;font-size:14px;margin:3px 4px 3px 0}
button.x{border:1px solid #FCA5A5;color:var(--q);background:#fff;border-radius:12px;padding:9px 12px;font-size:14px;margin:3px 4px 3px 0}
input,select{width:100%;border:1px solid var(--ch);border-radius:12px;padding:11px 12px;font-size:16px;margin-bottom:8px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:#0F3D2E;color:#fff;padding:7px 5px;font-weight:600;text-align:center}
td{padding:7px 6px;border-bottom:1px solid var(--ch);text-align:center;white-space:nowrap}
a{color:var(--y);font-weight:600;text-decoration:none}td:first-child{text-align:left;font-weight:600}
tr.jami td{background:var(--yo);font-weight:800}tr.ort td{background:#F3F4F6;font-weight:700}
.ogoh{background:var(--sao);color:var(--sa);font-weight:700}.yomon{background:var(--qo);color:var(--q);font-weight:700}
.qamrov{overflow-x:auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#fff;border-top:1px solid var(--ch);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 9px;font-size:11px;color:var(--s)}nav button em{display:block;font-style:normal;font-size:21px}
nav button.on{color:var(--y);font-weight:800;box-shadow:inset 0 3px 0 var(--y)}
.yuk{color:#D1FAE5;text-align:center;padding:30px 0}.xabar{position:fixed;left:12px;right:12px;bottom:78px;z-index:9;background:#111827;color:#fff;border-radius:12px;padding:12px 14px;display:none}
.yangi{font-size:11px;color:#A7F3D0;text-align:right;margin:2px 4px}
details{background:#fff;border-radius:14px;margin-bottom:8px;padding:10px 14px}summary{font-weight:700;cursor:pointer}details p,details li{color:#374151;line-height:1.5}
pre{white-space:pre-wrap;font-family:inherit;margin:0;font-size:14px;line-height:1.5}
.mq{cursor:pointer}.mq:active{opacity:.7}details.karta summary{cursor:pointer;list-style:none}details.karta[open] summary{margin-bottom:8px}
</style>

<body>
<header><div class="bosh"><b>TIROX</b><small id="kim">ALLMAX FIX PRICE</small></div><button onclick="och('qollanma')">❔</button><button onclick="yangila()">⟳</button></header>
<main id="m"><div class="yuk">Yuklanmoqda…</div></main>
<div class="xabar" id="xabar"></div>
<nav id="nav"></nav>
<script>
// API manzili botdagi tugma havolasida keladi (?api=...). Bu faylda hech qanday kalit yo'q
var API = new URLSearchParams(location.search).get('api') || '';
var tg = window.Telegram && Telegram.WebApp, INIT = (tg && tg.initData) || (function(){try{return new URLSearchParams(location.hash.slice(1)).get('tgWebAppData')||'';}catch(x){return '';}})(), MEN = null, BOL = '', KESH = {};
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0B2E22'); tg.setBackgroundColor('#0B2E22'); } catch (e) {} }
function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function son(x) { return x == null || x === '' ? '—' : String(Math.round(Number(x) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function foiz(a, b) { if (!b) return ''; var z = (a - b) / Math.abs(b) * 100; return '<span class="' + (z >= 0 ? 'up' : 'down') + '">' + (z >= 0 ? '▲' : '▼') + Math.abs(z).toFixed(1).replace('.', ',') + '%</span>'; }
function xabar(m) { var x = document.getElementById('xabar'); x.textContent = m; x.style.display = 'block'; clearTimeout(xabar.t); xabar.t = setTimeout(function () { x.style.display = 'none'; }, 3500); }
function lsO(k) { try { return JSON.parse(localStorage.getItem('tx_' + k) || 'null'); } catch (z) { return null; } }
function lsY(k, v) { try { localStorage.setItem('tx_' + k, JSON.stringify(v)); } catch (z) {} }
function api(a, p) {
  var url = API + '?api=1&a=' + encodeURIComponent(a) + '&d=' + encodeURIComponent(INIT) + '&p=' + encodeURIComponent(JSON.stringify(p || {}));
  return fetch(url).then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) throw new Error(j.xato); return j.d; });
}
// Avval saqlangan javobni darhol chizadi, keyin yangisini oladi
function ol(a, p, chiz) {
  var k = a + JSON.stringify(p || {}), eski = lsO(k);
  if (eski) chiz(eski.d, eski.v);
  return api(a, p).then(function (d) { lsY(k, { d: d, v: Date.now() }); if (BOL === chiz.bol) chiz(d, Date.now()); })
    .catch(function (z) { if (!eski) qoy('<div class="karta">⛔ ' + e(z.message) + '</div>'); else xabar('⛔ ' + z.message); });
}
function qoy(h) { document.getElementById('m').innerHTML = h; }
function vaqt(v) { if (!v) return ''; var m = Math.round((Date.now() - v) / 60000); return '<div class="yangi">' + (m < 1 ? 'hozirgina yangilandi' : m + ' daqiqa oldin') + '</div>'; }
function bor(h) { return MEN && MEN.huquq.indexOf(h) >= 0; }

var BOLIM = [['hisobot', '📊', 'Hisobot', 'hisobot'], ['nazorat', '🛡', 'Nazorat', 'tizim'], ['qongiroq', '📞', 'Qo\'ng\'iroq', 'qongiroq'], ['mijoz', '🔍', 'Mijoz', 'mijoz'], ['cashback', '💰', 'Cashback', 'cashback'], ['push', '📣', 'Push', 'push'], ['odamlar', '👥', 'Odamlar', 'odamlar']];
function och(b) {
  BOL = b; window.scrollTo(0, 0);
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (x) { x.className = x.dataset.b === b ? 'on' : ''; });
  ({ hisobot: hisobot, nazorat: nazorat, qongiroq: qongiroq, mijoz: mijoz, cashback: cashback, push: push, odamlar: odamlar, qollanma: qollanma }[b])();
}
function yangila() { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('tx_') === 0) localStorage.removeItem(k); }); } catch (z) {} och(BOL); }

// ---------- HISOBOT (Tirox'dagidek: davr tanlash, grafik, panellar) ----------
function tk(n) { return new Date(Date.now() + 5 * 3600000 - n * 86400000).toISOString().slice(0, 10); }
var DAVR = [['Bugun', 0, 0], ['Kecha', 1, 1], ['7 kun', 6, 0], ['4 hafta', 27, 0], ['6 oy', 182, 0], ['12 oy', 364, 0], ['Oy boshidan', -1, 0], ['Davr…', -2, 0]];
var HS = { i: 0, a: '', b: '', g: 1, sel: -1, d: null, eski: null };
function hsOraliq() {
  var x = DAVR[HS.i];
  if (x[1] === -2) return [HS.a || tk(6), HS.b || tk(0)];
  if (x[1] === -1) return [tk(0).slice(0, 8) + '01', tk(0)];
  return [tk(x[1]), tk(x[2])];
}
function hisobot() { qoy('<div class="yuk">Yuklanmoqda…</div>'); HS.sel = -1; hsYukla(false); }
function hsYukla(yangi) {
  var r = hsOraliq(), f = function (d, v) { HS.d = d; HS.v = v; hisobotChiz(); }; f.bol = 'hisobot';
  var eski = function (d) { HS.eski = d; if (HS.d) hisobotChiz(); }; eski.bol = 'hisobot'; ol('hisobot', {}, eski);
  if (yangi) return api('hisobot2', { a: r[0], b: r[1], yangi: 1 }).then(function (d) { HS.d = d; HS.v = Date.now(); hisobotChiz(); xabar('✅ Yangilandi: ' + d.vaqt); }).catch(function (z) { xabar('⛔ ' + z.message); });
  return ol('hisobot2', { a: r[0], b: r[1] }, f);
}
function hsDavr(i) { HS.i = i; HS.sel = -1; if (DAVR[i][1] === -2) { if (!HS.a) { HS.a = tk(6); HS.b = tk(0); } hisobotChiz(); return; } HS.d = null; qoy('<div class="yuk">Yuklanmoqda…</div>'); hsYukla(false); }
function hsKo() { var a = document.getElementById('da').value, b = document.getElementById('db').value; if (!a || !b) return xabar('Ikkala sanani tanlang'); HS.a = a; HS.b = b; HS.d = null; qoy('<div class="yuk">Yuklanmoqda…</div>'); hsYukla(false); }
setInterval(function () { if (BOL === 'hisobot' && !document.hidden && HS.d && HS.d.b === HS.d.bugun) hsYukla(false); }, 300000);
function qisqa(x) { x = Number(x) || 0; if (x >= 1e6) return (x / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'; if (x >= 1e3) return Math.round(x / 1e3) + 'k'; return String(Math.round(x)); }
function chiroyMax(m) { if (m <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log(m) / Math.LN10)), z = m / p; return (z <= 1 ? 1 : z <= 2 ? 2 : z <= 5 ? 5 : 10) * p; }
var GN = ['Savdo, so\'m', 'Cheklar', 'Berilgan bonus'];
function gTanla(i) { HS.sel = i; var r = HS.d.grafik.qator[i]; var el = document.getElementById('ginfo'); if (el) el.innerHTML = '<b>' + e(r[0]) + (HS.d.grafik.tur === 'soat' ? ':00' : '') + '</b> · savdo ' + son(r[1]) + ' · ' + son(r[2]) + ' chek · bonus ' + son(r[3]); }
function gTur(k) { HS.g = k; hisobotChiz(); }
function grafikSvg(g, k) {
  var Q = g.qator, n = Q.length, W = 340, H = 170, L = 38, B = 20, T = 14, mx = 0;
  Q.forEach(function (r) { if (r[k] > mx) mx = r[k]; });
  var M = chiroyMax(mx), bw = (W - L) / n, h = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">';
  for (var i = 0; i <= 4; i++) { var y = T + (H - T - B) * (1 - i / 4); h += '<line x1="' + L + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#E5E7EB"/><text x="' + (L - 4) + '" y="' + (y + 3) + '" font-size="8" text-anchor="end" fill="#6B7280">' + qisqa(M * i / 4) + '</text>'; }
  var qadam = Math.ceil(n / 8);
  Q.forEach(function (r, j) {
    var hh = (H - T - B) * (r[k] / M), x = L + j * bw, y = H - B - hh;
    h += '<rect x="' + (x + bw * 0.12) + '" y="' + y + '" width="' + (bw * 0.76) + '" height="' + Math.max(hh, r[k] > 0 ? 1.5 : 0) + '" rx="2" fill="' + (HS.sel === j ? '#0F766E' : '#166534') + '" onclick="gTanla(' + j + ')"/>';
    h += '<rect x="' + x + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B) + '" fill="transparent" onclick="gTanla(' + j + ')"/>';
    if (n <= 24 && r[k] > 0 && bw > 11) h += '<text x="' + (x + bw / 2) + '" y="' + (y - 2) + '" font-size="7" text-anchor="middle" fill="#374151">' + qisqa(r[k]) + '</text>';
    if (j % qadam === 0) h += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" font-size="8" text-anchor="middle" fill="#6B7280">' + e(r[0]) + '</text>';
  });
  return h + '</svg>';
}
function sanaUz(s) { return s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4); }
function hisobotChiz() {
  var d = HS.d, h = '';
  var chips = '<div class="tabs">' + DAVR.map(function (x, i) { return '<button class="' + (i === HS.i ? 'on' : '') + '" onclick="hsDavr(' + i + ')">' + x[0] + '</button>'; }).join('') + '</div>';
  if (DAVR[HS.i][1] === -2) chips += '<div class="karta"><div style="display:flex;gap:8px"><div style="flex:1"><div class="kichik">Qaysi sanadan</div><input id="da" type="date" max="' + tk(0) + '" value="' + e(HS.a) + '"></div><div style="flex:1"><div class="kichik">Qaysi sanagacha</div><input id="db" type="date" max="' + tk(0) + '" value="' + e(HS.b) + '"></div></div><button class="a" style="width:100%" onclick="hsKo()">Ko\'rsatish</button></div>';
  if (!d) { qoy(chips + (DAVR[HS.i][1] === -2 ? '' : '<div class="yuk">Yuklanmoqda…</div>')); return; }
  var q = d.q, o = d.o, bugunmi = d.b === d.bugun;
  function dl(k) { return o && o[k] != null && q[k] != null ? foiz(q[k], o[k]) : ''; }
  function kp(nom, k, kat) { return '<div><small>' + nom + '</small><b>' + son(q[k]) + '</b>' + dl(k) + '</div>'; }
  h += chips + '<div class="oq" style="text-align:center">' + (d.a === d.b ? sanaUz(d.a) : sanaUz(d.a) + ' – ' + sanaUz(d.b) + ' (' + d.uzun + ' kun)') + ' · soat ' + e(d.vaqt) + (d.oxirgi ? ' · oxirgi operatsiya ' + e(d.oxirgi) : '') + '</div>';
  if (bugunmi) h += '<div style="text-align:center;margin-bottom:6px"><button class="o" onclick="this.disabled=true;this.textContent=\'⏳ Yangilanmoqda…\';hsYukla(true)">⟳ Hozir yangilash</button><div class="kichik" style="color:#A7F3D0">Har 5 daqiqada o\'zi yangilanadi</div></div>';
  h += '<div class="kpi">' + kp('Yalpi daromad, so\'m', 'savdo') + kp('Cheklar', 'chek') + kp('O\'rtacha chek', 'ortacha') + kp('Mijozlar', 'mijoz') + '</div>';
  var T2 = d.tirox || {}, ok = T2 && T2.xato == null && T2.ltv != null;
  h += '<div class="kpi" style="margin-top:10px">' + kp('Yangi mijozlar', 'yangi') + kp('Qayta kelganlar', 'qayta') +
    '<div><small>Mijoz umr daromadi (LTV)</small><b>' + (ok ? Number(T2.ltv).toFixed(2).replace('.', ',') : '—') + '</b></div><div><small>Investitsiya rentabelligi (ROI)</small><b>' + (ok && T2.roi != null ? '1 → ' + Number(T2.roi).toFixed(2).replace('.', ',') : '—') + '</b></div></div>';
  var gk = HS.g, gr = d.grafik;
  h += '<h3>' + (gr.tur === 'soat' ? 'Soatlar bo\'yicha' : gr.tur === 'hafta' ? 'Haftalar bo\'yicha' : 'Kunlar bo\'yicha') + '</h3><div class="karta"><div class="tabs" style="margin-bottom:6px">' +
    GN.map(function (x, i) { return '<button style="' + (i + 1 === gk ? 'background:#166534;color:#fff' : 'background:#F3F4F6;color:#374151') + '" onclick="gTur(' + (i + 1) + ')">' + x + '</button>'; }).join('') + '</div>' +
    grafikSvg(gr, gk) + '<div id="ginfo" class="kichik" style="min-height:18px;margin-top:4px">' + (gr.qator.length ? 'Ustunni bosing — aniq summa chiqadi' : '') + '</div></div>';
  if (d.yangiSavdo != null && q.savdo > 0) {
    var yp = Math.round(d.yangiSavdo / q.savdo * 100);
    h += '<h3>Daromad tuzilmasi</h3><div class="karta"><div style="display:flex;height:16px;border-radius:8px;overflow:hidden"><div style="width:' + (100 - yp) + '%;background:#166534"></div><div style="width:' + yp + '%;background:#0EA5E9"></div></div>' +
      '<div class="qator"><span>🟩 Qaytgan mijozlardan</span><span>' + son(q.savdo - d.yangiSavdo) + '</span></div><div class="qator"><span>🟦 Yangi mijozlardan</span><span>' + son(d.yangiSavdo) + '</span></div></div>';
  }
  h += '<h3>Bonus</h3><div class="karta">' + [['Berilgan bonus', 'berilgan'], ['· avto', 'avto'], ['· qo\'lda qo\'shilgan', 'qolda'], ['Ishlatilgan bonus', 'ishlat'], ['· qo\'lda ayirilgan', 'ayir'], ['Kuygan bonus', 'kuygan'], ['Qaytarilgan summa', 'qaytar'], ['Yangi kartalar', 'karta']].map(function (x) {
    return '<div class="qator"><span>' + x[0] + '</span><span>' + son(q[x[1]]) + ' ' + dl(x[1]) + '</span></div>'; }).join('') + (d.eslatma ? '<div class="kichik" style="margin-top:6px">' + e(d.eslatma) + '</div>' : '') + '</div>';
  if (ok && (T2.xarajat != null || T2.daromad != null)) h += '<div class="karta"><div class="qator"><span>Tirox hisobi: daromad</span><span>' + son(T2.daromad) + '</span></div><div class="qator"><span>Tirox hisobi: xarajat</span><span>' + son(T2.xarajat) + '</span></div></div>';
  else if (T2.xato) h += '<div class="oq" style="text-align:center">LTV/ROI Tirox\'dan olinmadi (' + e(T2.xato) + ')</div>';
  var b = HS.eski && HS.eski.bonus;
  if (b) h += '<h3>Bonus kuyadi</h3><div class="karta">' + [['7 kun ichida', b.k7], ['30 kun ichida', b.k30], ['90 kun ichida', b.k90], ['Muddati o\'tgan', b.otgan]].map(function (x) {
    return '<div class="qator"><span>' + x[0] + '</span><span>' + son(x[1][0]) + ' · ' + son(x[1][1]) + ' mijoz</span></div>'; }).join('') + '</div>';
  qoy(vaqt(HS.v) + h + (HS.eski ? '<div class="oq" style="text-align:center">Oxirgi nazorat: ' + e(HS.eski.nazorat) + '</div>' : ''));
  if (HS.sel >= 0 && gr.qator[HS.sel]) gTanla(HS.sel);
  var on = document.querySelector('.tabs button.on'); if (on && on.scrollIntoView) { try { on.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (z) {} }
}

// ---------- NAZORAT: xatolar, kassirlar, tizim ----------
var FK = 7;
function nazorat() {
  qoy('<div class="yuk">Yuklanmoqda…</div>');
  var f = function (d, v) { nazorat.d = d; nazorat.v = v; nazoratChiz(); }; f.bol = 'nazorat'; ol('nazorat', {}, f);
  var g = function (d) { nazorat.f = d; nazoratChiz(); }; g.bol = 'nazorat'; ol('faoliyat', { kun: FK }, g);
}
function nazoratChiz() {
  var d = nazorat.d; if (!d) return;
  var f = nazorat.f, h = vaqt(nazorat.v);

function mVaqt(s) { var d = new Date(s); if (isNaN(d.getTime())) return String(s); var z = function (n) { return ('0' + n).slice(-2); }; return z(d.getDate()) + '.' + z(d.getMonth() + 1) + '.' + d.getFullYear() + (/T\d/.test(String(s)) ? ' ' + z(d.getHours()) + ':' + z(d.getMinutes()) : ''); }
function ravon(o, pre, out) {
  if (o === null || o === undefined || o === '') return out;
  if (Array.isArray(o)) { if (o.every(function (x) { return x === null || typeof x !== 'object'; })) { if (o.length) out.push([pre, o.join(', ')]); } else o.forEach(function (x, i) { ravon(x, pre + ' ' + (i + 1), out); }); return out; }

  var v = o;

  if (m.length < 3) return xabar('Matnni yozing');
  if (PS.kim === 'bitta' && !PS.tanlangan) return xabar('Mijozni tanlang');
  if (document.getElementById('pr').checked && !vq) return xabar('Vaqtni tanlang');
  var p = { matn: m, kim: PS.kim === 'hamma' ? 'hamma' : PS.tanlangan.kod }; if (vq) p.vaqt = vq;
  var ish = function () { xabar('⏳ Yuborilmoqda…'); api('pushYubor', p).then(function (r) { xabar('✅ ' + r.matn); PS.tanlangan = null; push(); }).catch(function (z) { xabar('⛔ ' + z.message); }); };
  var s1 = (PS.kim === 'hamma' ? 'HAMMA karta egalariga' : PS.tanlangan.ism + 'ga') + (vq ? ' (' + vq.replace('T', ' ') + 'da)' : '') + ' push yuborilsinmi?\n\n' + m.slice(0, 120);
  var qadam = function (ha) { if (!ha) return; if (PS.kim !== 'hamma') return ish(); p.tasdiq = 'HAMMAGA'; var s2 = 'Aniq ishonchingiz komilmi? Hammaga ketgan push qaytarilmaydi.'; if (tg && tg.showConfirm) tg.showConfirm(s2, function (h2) { if (h2) ish(); }); else if (confirm(s2)) ish(); };
  if (tg && tg.showConfirm) tg.showConfirm(s1, qadam); else qadam(confirm(s1));
}

// ---------- CASHBACK (hozircha faqat ko'rish) ----------
var KUN = ['Yak', 'Dush', 'Sesh', 'Chor', 'Pay', 'Jum', 'Shan'];
function cashback() { qoy('<div class="yuk">Yuklanmoqda…</div>'); var f = function (d, v) { cashbackChiz(d, v); }; f.bol = 'cashback'; ol('cashback', {}, f); }
function cashbackChiz(d, v) {
  var R = d.ranges || [], H = d.happy || [];
  var h = vaqt(v) + '<div class="karta"><div style="font-size:18px;font-weight:800">' + e(d.nom || 'Karta shabloni') + '</div><div class="kichik">Shablon ' + e(d.id) + ' · turi: ' + e(d.tur || '—') + '</div></div>' +
    '<h3>Cashback darajalari</h3><div class="karta">' + (R.length ? R.map(function (r) {
      return '<div class="qator"><span><b>' + e(r.name || '—') + '</b><div class="kichik">' + (Number(r.threshold) ? son(r.threshold) + ' so\'mdan' : 'boshlang\'ich daraja') + '</div></span><span style="font-size:20px;color:var(--y)">' + e(r.cashbackPercent == null ? '—' : r.cashbackPercent) + '%</span></div>'; }).join('') : '<div class="kichik">Daraja topilmadi</div>') + '</div>' +
    '<h3>Happy hours (vaqt bo\'yicha)</h3><div class="karta">' + (H.length ? H.map(function (x) {
      var kn = (x.daysOfWeek && x.daysOfWeek.length && x.daysOfWeek.length < 7) ? x.daysOfWeek.map(function (k) { return KUN[k]; }).join(', ') : 'Har kuni';
      var m = Number(x.multiplier) || 0;
      var nat = R.length && m ? '<div class="kichik">Shu vaqtda: ' + R.map(function (r) { return e(r.name || '') + ' ' + (Math.round((Number(r.cashbackPercent) || 0) * m * 100) / 100) + '%'; }).join(' · ') + '</div>' : '';
      return '<div class="qator"><span><b>' + e(x.from || '') + ' – ' + e(x.till || '') + '</b><div class="kichik">' + e(kn) + '</div></span><span>× ' + e(x.multiplier) + '</span></div>' + nat; }).join('') : '<div class="kichik">Happy hours yo\'q</div>') + '</div>' +
    '<div class="oq" style="text-align:center">Hozircha faqat ko\'rish. «× 1.5» — shu vaqtda cashback 1.5 baravar bo\'ladi. O\'zgartirish keyingi bosqichda.</div>' +
    '<details class="karta"><summary><b>Tirox\'dan kelgan hamma sozlama</b></summary>' + jadval(d.hammasi) + '</details>';
  qoy(h);
}

// ---------- ODAMLAR ----------
var RN = { ega: '👑 Ega', rahbar: '🏛 Rahbariyat', admin: '👤 Admin', xodim: '🧑‍💼 Xodim' };
function odamlar() {
  qoy('<div class="yuk">Yuklanmoqda…</div>');
  api('odamlar').then(function (d) {
    var tug = function (id, joriy) { return d.mumkin.filter(function (r) { return r !== joriy; }).map(function (r) { return '<button class="o" onclick="odam(\'' + id + '\',\'' + r + '\')">' + RN[r] + '</button>'; }).join(''); };
    var h = '<h3>Yangi so\'rovlar (' + d.sorov.length + ')</h3>' + (d.sorov.length ? d.sorov.map(function (s) {
      return '<div class="karta"><b>' + e(s.ism) + '</b> ' + e(s.user) + '<div class="kichik">ID ' + e(s.id) + ' · ' + e(s.sana) + '</div><div style="margin-top:6px">' + tug(s.id, '') + '<button class="x" onclick="odam(\'' + s.id + '\',\'rad\')">Rad etish</button></div></div>'; }).join('')
      : '<div class="karta kichik">Yangi odam qo\'shish: u botni ochib <b>/start</b> bossin — so\'rovi shu yerda chiqadi.</div>');
    h += '<h3>Ro\'yxat (' + d.royxat.length + ')</h3>' + d.royxat.map(function (a) {
      var ozgar = a.rol !== 'ega' && a.id !== d.men && d.mumkin.indexOf(a.rol) >= 0;
      return '<div class="karta"><b>' + e(a.ism) + '</b> ' + e(a.user) + '<div class="kichik">' + RN[a.rol] + '</div>' + (ozgar ? '<div style="margin-top:6px">' + tug(a.id, a.rol) + '<button class="x" onclick="odam(\'' + a.id + '\',\'ochir\')">O\'chirish</button></div>' : '') + '</div>'; }).join('');
    h += '<div class="karta kichik">👑 Ega — hammasi, bonus ±, odam qo\'shish<br>🏛 Rahbariyat — hamma hisobot va nazoratni ko\'radi, o\'zgartirmaydi<br>👤 Admin — ko\'radi, tizimni tuzatadi, xodim qo\'shadi<br>🧑‍💼 Xodim — faqat mijoz qidirish</div>';
    qoy(h);
  }).catch(function (z) { qoy('<div class="karta">⛔ ' + e(z.message) + '</div>'); });
}
function odam(id, amal) {
  var bajar = function (ha) { if (!ha) return; api('odamAmal', { id: id, amal: amal }).then(function (d) { xabar('✅ ' + d.matn); odamlar(); }).catch(function (z) { xabar('⛔ ' + z.message); }); };
  var s = amal === 'ochir' ? 'Bu odam o\'chirilsinmi?' : amal === 'rad' ? 'So\'rov rad etilsinmi?' : RN[amal] + ' qilinsinmi?';
  if (tg && tg.showConfirm) tg.showConfirm(s, bajar); else bajar(confirm(s));
}
